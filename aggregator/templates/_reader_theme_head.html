{% if reader_themes is defined %}
    <script id="reader-theme-config" type="application/json">{{ reader_themes|tojson }}</script>
    <link id="reader-theme-stylesheet" rel="stylesheet" {% if reader_themes.themes[reader_themes.desktop].url %}href="{{ reader_themes.themes[reader_themes.desktop].url }}"{% endif %}>
    <script src="{{ url_for('static', filename='js/reader_theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reader_preferences.css') }}">
{% endif %}
